services:
  - type: web
    name: valhalla-vape-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: PAYMENT_ALIAS
        sync: false
      - key: PAYMENT_HOLDER
        sync: false
      - key: PAYMENT_CVU
        sync: false
